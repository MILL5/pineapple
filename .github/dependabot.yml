version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # EF Core 8.x is pinned for the net8.0 target; majors move with the target framework.
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bundler
    directory: "/docs"
    schedule:
      interval: monthly
    groups:
      docs:
        patterns: ["*"]
