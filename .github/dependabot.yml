version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      ef-core:
        patterns: ["Microsoft.EntityFrameworkCore*"]
      mstest:
        patterns: ["MSTest*"]
    ignore:
      # EF Core 8.x is pinned for the net8.0 target; majors move with the target framework.
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: bundler
    directory: "/docs"
    schedule:
      interval: monthly
