name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.100-rc.3.26522.148
      - run: dotnet restore Pineapple.slnx
      - run: dotnet build Pineapple.slnx -c Release --no-restore
      - run: dotnet test --solution Pineapple.slnx -c Release --no-build
      - run: dotnet pack Pineapple.slnx -c Release --no-build -o artifacts
        if: matrix.os == 'ubuntu-latest'
      - run: bash scripts/verify-packages.sh artifacts
        if: matrix.os == 'ubuntu-latest'
      - run: dotnet list Pineapple.slnx package --vulnerable --include-transitive
      - run: dotnet list Pineapple.slnx package --deprecated --include-transitive


  sql-integration:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Pineapple_CI2026!
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      PINEAPPLE_SQL_CONNECTION: "Server=127.0.0.1,1433;Database=master;User Id=sa;Password=Pineapple_CI2026!;TrustServerCertificate=true"
      PINEAPPLE_REQUIRE_SQL_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.100-rc.3.26522.148
      - run: dotnet test --project "$GITHUB_WORKSPACE/Pineapple.Data.Tests/Pineapple.Data.Tests.csproj" -c Release
