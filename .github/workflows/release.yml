name: Release

# Publishes Pineapple and Pineapple.Data to NuGet when a version tag (v1.2.3) is pushed on main.
# Uses NuGet.org Trusted Publishing for MILL5/pineapple, release.yml.
on:
  push:
    tags: [ "v*.*.*" ]

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Pineapple_CI2026!
        ports: ["1433:1433"]
        options: >-
          --health-cmd '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b'
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      PINEAPPLE_SQL_CONNECTION: "Server=127.0.0.1,1433;Database=master;User Id=sa;Password=Pineapple_CI2026!;TrustServerCertificate=true"
      PINEAPPLE_REQUIRE_SQL_TESTS: '1'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.100-rc.3.26522.148

      - name: Verify both packages match the release version
        run: |
          for project in Pineapple/Pineapple.csproj Pineapple.Data/Pineapple.Data.csproj; do
            version=$(dotnet msbuild "$project" -getProperty:PackageVersion)
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::$project version $version does not match tag $GITHUB_REF_NAME"; exit 1; }
          done

      - name: Test
        run: dotnet test --solution Pineapple.slnx -c Release

      - name: Pack
        run: dotnet pack Pineapple.slnx -c Release -o artifacts

      - name: Verify consumer packages
        run: bash scripts/verify-packages.sh artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: richcrane

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --title "Pineapple $GITHUB_REF_NAME" --generate-notes
